name: Build and Release

on:
  push:
    tags:
      - 'v*' # เมื่อมี tag ที่ขึ้นต้นด้วย 'v' เช่น v1.0.0
  workflow_dispatch: # สามารถ run manual ได้

# 🔑 Permissions ที่จำเป็น
permissions:
  contents: write
  actions: read
  security-events: write

env:
  FLUTTER_VERSION: '3.29.3'

jobs:
  # 🏗️ Build for Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Create Windows Installer
        run: |
          # ใช้ Inno Setup หรือ NSIS สร้าง installer
          # สำหรับตัวอย่างนี้เราจะ zip ไฟล์
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "InternApp-Windows-${{ github.ref_name }}.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "InternApp-Windows-${{ github.ref_name }}.zip"

  # 🍎 Build for macOS
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS App
        run: |
          flutter build macos --release
          echo "Built app contents:"
          ls -la "build/macos/Build/Products/Release/"

      - name: Create Package
        run: |
          # สร้าง DMG file หรือ ZIP ถ้า DMG ไม่สำเร็จ
          mkdir -p dist
          
          # Check if the app exists
          if [ ! -d "build/macos/Build/Products/Release/OHO Task.app" ]; then
            echo "Error: OHO Task.app not found!"
            echo "Available files:"
            ls -la "build/macos/Build/Products/Release/"
            exit 1
          fi
          
          cp -R "build/macos/Build/Products/Release/OHO Task.app" dist/
          
          # ลอง create DMG ก่อน
          if hdiutil create -volname "InternApp" -srcfolder dist -ov -format UDZO "InternApp-macOS-${{ github.ref_name }}.dmg" 2>/dev/null; then
            echo "DMG created successfully"
          else
            echo "DMG creation failed, creating ZIP instead"
            cd dist
            zip -r "../InternApp-macOS-${{ github.ref_name }}.zip" .
            cd ..
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            InternApp-macOS-${{ github.ref_name }}.dmg
            InternApp-macOS-${{ github.ref_name }}.zip

  #  Create Release
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: |
          echo "Downloaded files:"
          find . -name "*.zip" -o -name "*.dmg" | head -10

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            windows-build/*.zip
            macos-build/*.dmg
            macos-build/*.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## 🎉 InternApp ${{ github.ref_name }}
            
            ### 📥 Downloads
            - **Windows**: InternApp-Windows-${{ github.ref_name }}.zip
            - **macOS**: InternApp-macOS-${{ github.ref_name }}.dmg (หรือ .zip)
            
            ### 🔄 Auto Update
            แอปพลิเคชันจะตรวจสอบอัปเดตอัตโนมัติทุก 6 ชั่วโมง
            หรือสามารถตรวจสอบด้วยตนเองได้ในหน้าการตั้งค่า
            
            ### 📋 รายละเอียดการอัปเดต
            - Bug fixes และ improvements
            - เพิ่มฟีเจอร์ใหม่
            - ปรับปรุงประสิทธิภาพ
            
            ---
            **Installation**: ดาวน์โหลดไฟล์ที่เหมาะสมกับระบบปฏิบัติการของคุณ
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
